# CCP write fixture: explicit opt-in compiles the write-only implementation and actions.
packages:
  common: !include common.yaml

ccp:
  id: bms_ccp
  can_gateway_id: diag_bus
  allow_write: true

script:
  - id: exercise_ccp_write
    then:
      - ccp.download: {id: bms_ccp, data: [0x01, 0x02, 0x03]}
      - ccp.write_memory: {id: bms_ccp, ext: 0, address: 0x10203040, data: [1, 2, 3, 4, 5, 6, 7]}
