# Replaces the built-in page with a custom one (web_asset, relative to this YAML).
packages:
  entities: !include common_entities.yaml

logger:

wifi:
  ssid: demo-network
  password: demo-password-1

portal:
  build: demo-asset
  web_asset: custom_page.html
  tree:
    - segment: vehicle
      kind: vehicle
      label: Demo vehicle
      values:
        - key: supply
          label: Supply
          unit: V
          sensor: supply_voltage
