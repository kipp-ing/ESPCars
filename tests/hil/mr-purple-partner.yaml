# Mr. Purple's bench partner — flash onto the C6 wired to Mr. Purple.
# See docs/commissioning-mr-purple.md (phases P3/P4/P5).
#
# This is NOT a token-ring member. It is a deliberately boring counterpart:
# one CAN segment that ACKs and emits a slow beacon, plus a LIN master that
# polls Mr. Purple and publishes something for him to sniff. Nothing here
# floods the bus — during bring-up, load is noise.
#
#   .venv/bin/esphome run tests/hil/mr-purple-partner.yaml --device <port>
#
# ONE CAN PORT AT A TIME, on purpose. Issue #1 (docs/HANDOVER.md) is that a
# healthy port can deliver zero RX while its sibling cycles bus-off recovery —
# and during P4 the MCP2515 half of Mr. Purple is dead by definition, so a
# two-port partner would cycle bus-off on one port and silently sabotage the
# other. Declaring one port sidesteps it completely. Switch segments with a
# substitution override rather than editing this file:
#
#   P4, C6 CAN1 <-> Mr. Purple CAN0 (native TWAI)   -- the default below
#   P5, C6 CAN2 <-> Mr. Purple CAN1 (MCP2515):
#     .venv/bin/esphome -s can_tx GPIO10 -s can_rx GPIO11 \
#       run tests/hil/mr-purple-partner.yaml --device <port>
#
# WARNING: flashing this onto Mr. Blue/Green/Orange takes that board out of the
# token ring. `script/hil/flash.sh <name>` puts it back.

substitutions:
  node_name: purple-partner
  can_tx: GPIO2
  can_rx: GPIO3
  id_r: "70%"
  id_g: "0%"
  id_b: "100%"

packages:
  base: !include hil_common.yaml

can_gateway:
  id: gw
  ports:
    - id: seg
      tx_pin: ${can_tx}
      rx_pin: ${can_rx}
      bit_rate: 125kbps
      observe_queue_depth: 32
      on_bus_off:
        then:
          - lambda: 'ESP_LOGW("partner", "CAN bus-off - is Mr. Purple ACKing? check 120R + GND");'
      on_recovered:
        then:
          - lambda: 'ESP_LOGI("partner", "CAN recovered");'
  # Slow, identifiable beacon. If Mr. Purple sees 0x201 he has RX; if this
  # board's TEC stays 0 he is ACKing, which is the real proof of a live segment.
  cyclic_sends:
    - id: beacon
      port: seg
      can_id: 0x201
      interval: 100ms
      data: [0xC6, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x01]
  statistics:
    log_interval: 10s

# What Mr. Purple sends back, on whichever controller is under test.
sensor:
  - platform: can_gateway
    port_id: seg
    can_id: 0x301
    offset: 0
    length: 2
    byte_order: big
    name: "Purple counter"
    on_value:
      - lambda: 'ESP_LOGI("partner", "Purple 0x301 = %d", (int) x);'
  - platform: can_gateway
    port_id: seg
    bus_load:
      name: "CAN bus load"
    observed:
      name: "CAN observed"
    bus_err:
      name: "CAN bus errors"
    tec:
      name: "CAN TEC"
    rec:
      name: "CAN REC"

linbus:
  id: lin
  tx_pin: GPIO19
  rx_pin: GPIO18
  cs_pin: GPIO7
  baud_rate: 19200
  uart_port: UART_NUM_1
  mode: master
  schedule:
    # 0x20: Mr. Purple's LIN0 answers as slave -> proves his slave TX path.
    - lin_id: 0x20
      interval: 100ms
      length: 4
    # 0x21: this board's own response -> gives Mr. Purple's LIN0 (slave) and
    # LIN1 (listener) something to receive before his own TX works at all.
    - lin_id: 0x21
      interval: 100ms
  responses:
    - lin_id: 0x21
      data: [0xC6, 0xC6, 0x00, 0x01]
      checksum: enhanced
  rx_ids:
    - lin_id: 0x20
      length: 4
  on_frame:
    - lin_id: 0x20
      length: 4
      then:
        - lambda: |-
            ESP_LOGI("partner", "LIN 0x20 from Purple: %02X %02X %02X %02X",
                     data[0], data[1], data[2], data[3]);
  on_error:
    - then:
        - logger.log:
            format: "LIN error: %s"
            args: ["x.c_str()"]

interval:
  - interval: 10s
    then:
      - lambda: |-
          ESP_LOGI("partner", "partner alive - CAN ${can_tx}/${can_rx} @125k, LIN master 19200");
