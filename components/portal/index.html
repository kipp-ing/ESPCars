<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Portal</title>
<style>
:root{--bg:#000;--sf:#101315;--ln:#2f373b;--l2:#59646a;--tx:#f3f4f1;--mu:#c6cdd0;--fa:#a3acb1;--ac:#6fd6ea;--ink:#00161b;
--ok:#66d993;--wa:#ffc552;--bad:#ff7d6e;--tab:64px;color-scheme:dark}
*{box-sizing:border-box}
html{background:#000}
body{margin:0;background:#000;color:var(--tx);font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit;background:none}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
:disabled{opacity:.5;cursor:default}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header{padding:10px 16px 8px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px 10px;border-bottom:1px solid var(--ln)}
.ttl{flex:1;min-width:0}
h1{margin:0;font-size:30px;line-height:1.15;overflow-wrap:anywhere}
.cr{display:flex;flex-wrap:wrap;align-items:center;gap:0 6px}
.cr a{color:var(--ac);text-decoration:underline;text-underline-offset:3px;min-height:40px;display:inline-flex;align-items:center}
.st{flex-basis:100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-height:32px}
.cr,.st,.rs,.lb,.gs,.fb,.ft,.ax,.rd span{font-size:17px;color:var(--mu)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--ok)}
.dot.warn{background:var(--wa)}.dot.bad{background:var(--bad)}.dot.info{background:none;border:2px solid var(--mu)}
.hb{min-height:48px;padding:0 14px;border:1.5px solid var(--l2);border-radius:6px;font-size:17px;font-weight:600;display:inline-flex;align-items:center}
.hb[aria-pressed="true"]{background:var(--ac);color:var(--ink);border-color:var(--ac)}
main{flex:1;display:flex;flex-direction:column;padding:0 16px calc(var(--tab) + env(safe-area-inset-bottom) + 16px)}
#view{flex:1;display:flex;flex-direction:column}
h2{font-size:18px;font-weight:600;color:var(--mu);margin:24px 0 8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
h2 span{font-weight:400}
h2 a{min-height:48px;display:inline-flex;align-items:center}
.gl{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;padding:14px 0 4px}
.gl>*{display:flex;flex-direction:column;min-width:0;padding:6px 0}
.gl .w{grid-column:1/-1}
.hero{display:flex;align-items:baseline;gap:8px;overflow:hidden;white-space:nowrap}
.big{font-size:64px;line-height:1;font-weight:650;letter-spacing:-.02em}
.gl>:first-child .big{font-size:96px;line-height:.95}
.un{font-size:24px;color:var(--mu)}
.big,.rv,.mx b,.nc input,.rd{font-variant-numeric:tabular-nums}
.gs,.rs,.fb{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;font-size:17px;line-height:1.15;padding:2px 7px;border:1.5px solid var(--l2);border-radius:3px;color:var(--mu);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok)}.tag.warn{border-color:var(--wa);color:var(--wa)}
.tag.bad{border-color:var(--bad);color:var(--bad);font-weight:700}.tag.stale{border-style:dashed}.tag.run{border-color:var(--ac);color:var(--ac)}
.v-bad{color:var(--bad)}.v-warn{color:var(--wa)}.dim{color:var(--fa)}
.v-stale{color:var(--fa);text-decoration:underline dashed 2px;text-underline-offset:6px}
.mono{font-family:ui-monospace,monospace;font-size:17px;overflow-wrap:anywhere}
.note{display:block;border-left:5px solid var(--fa);background:var(--sf);padding:12px 14px;margin:8px 0;border-radius:0 4px 4px 0}
.note.bad{border-left-color:var(--bad)}.note.warn{border-left-color:var(--wa)}.note.ok{border-left-color:var(--ok)}
.note h3{margin:0;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:32px}
.note h3 a{flex:1;min-height:48px;display:flex;align-items:center;justify-content:space-between}
.note p{margin:4px 0 0;color:var(--mu)}
.rows{border-top:1px solid var(--ln)}
.note .rows{border:0}
.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row.c{flex-wrap:wrap}
.row.c .rl{flex-basis:100%}
.rl{flex:1;min-width:0;overflow-wrap:anywhere}
.rv{font-size:22px;font-weight:600;text-align:right;max-width:62%;overflow-wrap:anywhere}
.rv small,.mx small{font-size:17px;font-weight:400;color:var(--mu)}
button.row{width:100%;border:0;border-bottom:1px solid var(--ln);text-align:left;color:var(--ac)}
.chev{width:10px;height:10px;border-right:2px solid;border-top:2px solid;transform:rotate(45deg);flex:none;color:var(--fa);margin-right:4px}
.fb{padding:6px 0}
.btn{min-height:52px;width:100%;padding:0 18px;border:1.5px solid var(--l2);border-radius:6px;font-size:18px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:10px;padding:12px 0}
.acts>div{flex:1 1 40%}
.sw{flex:none;width:72px;height:48px;border:0;padding:0;position:relative}
.sw::before,.sw::after{content:"";position:absolute;border-radius:18px}
.sw::before{left:2px;top:6px;width:68px;height:36px;background:#252c30;border:2px solid var(--l2);box-sizing:border-box}
.sw::after{left:9px;top:13px;width:22px;height:22px;background:var(--mu)}
.sw[aria-checked="true"]::before{background:var(--ac);border-color:var(--ac)}
.sw[aria-checked="true"]::after{left:43px;background:var(--ink)}
.sw.busy::after{background:var(--wa)}
select,input,.nc button{min-height:52px;border:1.5px solid var(--l2);border-radius:6px;background:var(--sf);padding:0 12px;font-size:18px}
select{width:100%}
.nc{display:flex;gap:8px;flex:1}
.nc input{flex:1;min-width:0;text-align:center}
.nc .s{width:52px;flex:none;padding:0;font-size:26px;background:none}
.nc .btn{width:auto}
.acc{border-bottom:1px solid var(--ln)}
.acc>button{width:100%;min-height:64px;border:0;display:flex;align-items:center;gap:12px;text-align:left;padding:8px 0}
.acc>button .chev{transform:rotate(135deg)}
.acc>[aria-expanded="true"] .chev{transform:rotate(-45deg)}
.acc>div{padding:0 0 12px 12px;border-left:2px solid var(--ln)}
.hold{position:relative;overflow:hidden;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:none;margin-top:12px;border-color:var(--bad);color:var(--bad)}
.hold i{position:absolute;inset:0;background:var(--bad);opacity:.3;transform:scaleX(0);transform-origin:left}
.hold.on i{transform:none;transition:transform 1.6s linear}
.hold span{position:relative}
.bar{position:sticky;bottom:calc(var(--tab) + env(safe-area-inset-bottom));background:#000;border-top:1px solid var(--ln);padding:10px 0;margin-top:auto;display:flex;gap:10px;z-index:2}
.bar .bk{width:auto}
.bk .chev{transform:rotate(-135deg);color:inherit;margin:0 0 0 4px}
svg{display:block;width:100%;height:auto;touch-action:pan-y}
.rd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:6px}
.ax{margin:4px 0 0}
.mx{display:grid;grid-template-columns:1fr 1fr 1fr;margin-top:10px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln)}
.mx div{padding:10px 0;min-width:0}
.mx div+div{border-left:1px solid var(--ln);padding-left:12px}
.mx b{display:block;font-size:28px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#000;border-top:1.5px solid var(--l2);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav.tabs a{height:var(--tab);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--mu);position:relative;padding:14px 2px 0;text-align:center;line-height:1.1;hyphens:auto}
nav.tabs [aria-selected="true"]{color:var(--tx);font-weight:700}
nav.tabs [aria-selected="true"]::before{content:"";position:absolute;top:-1.5px;left:18%;right:18%;height:4px;background:var(--tx)}
.bg{position:absolute;top:2px;right:8%;min-width:20px;height:20px;padding:0 5px;border-radius:10px;font:700 17px/20px system-ui,sans-serif;background:var(--bad);color:#000}
.bg.warn{background:var(--wa)}
.bg.info{background:none;border:2px solid var(--mu);min-width:14px;height:14px;padding:0;top:4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:12px;width:calc(100% - 32px);max-width:528px;background:var(--sf);border:1.5px solid var(--ac);border-radius:6px;padding:12px 14px;z-index:9}
.ft{color:var(--fa);padding-top:20px;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.hold.on i{transition:none;transform:scaleX(.5)}}
</style>
</head>
