name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Schema tests + config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements_test.txt
      # The data-hygiene hard rule (CLAUDE.md): check.sh runs it locally, but
      # only this step holds it for a push from a machine that never did.
      - name: No private data
        run: python script/check_no_private_data.py
      - name: Run component schema tests
        run: python -m pytest tests/ -q
      - name: Validate build configs
        run: |
          set -e
          for y in tests/build/*/test*.yaml; do
            echo "::group::$y"
            esphome config "$y" > /dev/null
            echo "::endgroup::"
          done

  host-tests:
    name: Host unit tests (freestanding cores)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Several headers are deliberately ESPHome- and IDF-free so the exact code that
      # runs on the device also runs here: gateway_core.h (the RX ISR), sd_logger's
      # tap translation, and the uds catalog reader / decoder / scheduler. The
      # Makefile globs test_*.cpp, so a new suite is covered by adding the file.
      # Builds with ASan+UBSan and -fno-sanitize-recover, so a finding cannot exit 0.
      - name: Build and run host tests
        run: make -C tests/host

  compile:
    name: Compile ${{ matrix.config }}
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - tests/build/can_gateway/test.esp32-c6-idf.yaml
          - tests/build/can_gateway/test-monitor.esp32-c6-idf.yaml
          # Bridge with no diagnostics at all: the only config that compiles the
          # no-RX-taps branch and try_hw_filter_offload_. See common_bridge.yaml.
          - tests/build/can_gateway/test-bridge.esp32-c6-idf.yaml
          # Classic ESP32: one TWAI controller, so this is the single-
          # controller code path (and the target of docs/commissioning-mr-purple.md).
          - tests/build/can_gateway/test-monitor.esp32-idf.yaml
          # Sniffer: `on_frame:` is the only observation subscriber, so it is the
          # only config where USE_CAN_GATEWAY_OBSERVE (and with it
          # CanGatewayFrameTrigger) can come from the trigger's own codegen.
          # See common_sniffer.yaml.
          - tests/build/can_gateway/test-sniffer.esp32-c6-idf.yaml
          # Tap-only: `log_tap:` is the ports' only receive consumer — no
          # routes, no on_frame, no decode entities. The shape no config
          # compiled while it silently never received (HANDOVER-guest-bms.md
          # §8). See common_taponly.yaml.
          - tests/build/sd_logger/test-taponly.esp32-c6-idf.yaml
          - tests/build/linbus/test.esp32-idf.yaml
          - tests/build/linbus/test.esp32-c3-idf.yaml
          - tests/build/linbus/test.esp32-c6-idf.yaml
          - tests/build/isotp/test.esp32-c6-idf.yaml
          # uds with `embed: true`: the whole decode path — catalog open, name
          # resolution, group scheduling, bit extraction, scale evaluation,
          # entity publishing — compiled with NOTHING flashed. This is the only
          # config CI can build without a device, which is why the second
          # catalog source exists at all (DESIGN-uds.md §2).
          - tests/build/uds/test.esp32-c6-idf.yaml
          # uds with a memory-mapped partition: the case that actually runs on
          # the bench, and the only one that compiles esp_partition_mmap() and
          # esp32.add_partition(). It also builds two hubs sharing one `diag`
          # partition, so it proves codegen requests the partition exactly once
          # — add_partition() refuses a duplicate name.
          - tests/build/uds/test-partition.esp32-c6-idf.yaml
          - tests/build/ccp/test.esp32-c6-idf.yaml
          - tests/build/ccp/test-write.esp32-c6-idf.yaml
          # portal: minimal (no actions, no auth), full (all value kinds, series, four action
          # kinds on template entities, auth, AP + captive_portal), custom web_asset.
          - tests/build/portal/test-minimal.esp32-c6-idf.yaml
          - tests/build/portal/test.esp32-c6-idf.yaml
          - tests/build/portal/test-asset.esp32-c6-idf.yaml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements_test.txt
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ matrix.config }}-${{ hashFiles('requirements_test.txt') }}
      - name: Compile
        run: esphome compile ${{ matrix.config }}

  clang-format:
    name: C++ formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clang-format
        run: |
          pip install -r requirements_lint.txt
          python script/lint_report.py --only clang-format --summary

  upstream-lint:
    name: Python, YAML and whitespace lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_lint.txt
      - run: pip install -r requirements_lint.txt
      - name: Check Python, YAML and whitespace without modifying source files
        run: python script/lint_report.py --only ruff ruff-format pyupgrade yamllint end-of-file-fixer trailing-whitespace --summary
      - name: Summarize remaining advisory hooks
        if: always()
        run: python script/lint_report.py --only hook-config no-commit-to-branch ci-custom clang-tidy --report-only --summary

  clang-tidy:
    name: clang-tidy (report-only)
    runs-on: ubuntu-latest
    # Deliberately absent from Required checks.needs until P5 is clean.
    env:
      # ESPHome 2026.11 uses native ESP-IDF; cache its install and ccache too.
      ESPHOME_ESP_IDF_PREFIX: ~/.esphome-idf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements_test.txt
            requirements_lint.txt
      - run: pip install -r requirements_test.txt -r requirements_lint.txt
      - name: Cache toolchains
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.esphome-idf
          key: tidy-${{ runner.os }}-${{ hashFiles('requirements_test.txt') }}
      - name: Compile the seven clang-tidy targets
        run: |
          set -e
          python script/clang_tidy.py --list-targets | while IFS= read -r config; do
            esphome compile "$config"
          done
      - name: Report clang-tidy findings and count tables
        run: python script/clang_tidy.py --report-only

  ha-integration:
    name: Home Assistant glue (sdlog_relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The wire logic is tested in `validate` without HA (tests/relay/). This job
      # proves what only HA decides: auth, admin, X-Forwarded-For, ip_ban. Its own
      # venv because the harness pins a whole Home Assistant (docs/sdlog-relay-spec.md Q1).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests_ha/requirements.txt
      - run: pip install -r tests_ha/requirements.txt
      - name: Run HA glue tests
        run: python -m pytest -c tests_ha/pytest.ini tests_ha -q

  required-checks:
    name: Required checks
    if: always()
    needs: [validate, host-tests, compile, clang-format, upstream-lint, ha-integration]
    runs-on: ubuntu-latest
    steps:
      # One stable context for branch protection to require, instead of
      # pinning to every individual compile-matrix leg by name — a build
      # fixture can be renamed or added without touching the ruleset.
      - name: All required jobs passed
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "One or more required jobs did not succeed."
            exit 1
          fi
