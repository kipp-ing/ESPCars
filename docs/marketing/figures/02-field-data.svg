<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Record on the road. Analyse when you return.</title><desc id="desc">A three-phase workflow shows configuration and local checks at the bench, bus recording to SD while WiFi is unavailable, and subsequent host-based retrieval, verification, archiving and signal decoding. Connectivity and data flow sketches are schematic, not measurements.</desc>
