<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Components on the device, tools on the host</title><desc id="desc">Vehicle CAN and LIN connect to components on an ESP32 device. ESPHome supplies the firmware foundation, with application logic, diagnostics, recording and a local portal above it. A separate host pulls recorded files, archives them and decodes and publishes results.</desc>
