<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Gateway operation</title><desc id="desc">A schematic vehicle or bench and a separate ECU connect through a logical ESPCars gateway between two CAN segments. The device is represented by an application block and bridge, filter and signal-rewrite blocks, with runtime values and optional CRC-8 correction. Separate CCP access supports measurement and opt-in calibration writes.</desc>
